description: 'Comfort Systems USA (NYSE: FIX) is a Houston-based mechanical, electrical and plumbing contractor
  — one of the largest in the United States — that installs, services and maintains HVAC, piping, electrical and
  building-automation systems for commercial, industrial and institutional buildings through more than 45 operating
  companies in over 170 locations. Its business lines are construction (engineering and design, prefabrication,
  virtual construction), modular and off-site construction, building services (maintenance, on-demand and retrofit)
  and building automation (controls, monitoring, security and energy management). The company publishes no public
  API, developer program, SDK or machine-readable contract; its web presence is a WordPress marketing site and an
  investor-relations site.'
